name: check_ruff

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - master

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: install python
        uses: actions/setup-python@v6
        with:
              python-version: "3.13"
      - name: pip install ruff
        run: pip install ruff
      - name: ruff run
        run: ruff check > result.txt
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: result.txt
          message: |
            ```
            ASFHASJKHSAKFHJAFSGHSAJKASFHSAKJFKJASGHJASKGHIASGHSAJHIGAHSGIHAIUGHASIGHASHGFUIASGHJAGFHGASIUASUYAS
            ```