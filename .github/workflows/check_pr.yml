name: check_ruff

on:
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches:
      - master
permissions:
  pull-requests: write

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Download code
        uses: actions/checkout@v4

      - name: install python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: pip install ruff
        run: pip install ruff
      - name: Ruff run
        run: ruff check > result.txt 2>&1 || echo "No issues found or an error occurred" > result.txt

      - name: Send message with custom text
        uses: marocchino/sticky-pull-request-comment@v3
        with:
                path: result.txt
                message: |
                  Результаты проверки кода с помощью Ruff
                  
                  Вот результаты анализа кода:
                  
                  ```
                  {{{ content }}}
                  ```
                  
                  исправьте все ошибки, отмеченные выше